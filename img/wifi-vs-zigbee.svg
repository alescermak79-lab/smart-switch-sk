<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Roboto, Arial, sans-serif" role="img"><title>Porovnanie topológie Wi-Fi a Zigbee</title><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="76" font-size="38" font-weight="700" fill="#001233">Wi-Fi hviezda verzus Zigbee mesh</text><line x1="600" y1="118" x2="600" y2="556" stroke="#e6e8ec" stroke-width="2"/><text x="60" y="138" font-size="26" font-weight="700" fill="#0071b9">Wi-Fi: všetko visí na routeri</text><text x="640" y="138" font-size="26" font-weight="700" fill="#3aa757">Zigbee: zariadenia si signál podávajú</text><line x1="300" y1="330" x2="300" y2="178" stroke="#0071b9" stroke-width="3" stroke-dasharray="7 6"/><line x1="300" y1="330" x2="473" y2="254" stroke="#0071b9" stroke-width="3" stroke-dasharray="7 6"/><line x1="300" y1="330" x2="473" y2="406" stroke="#0071b9" stroke-width="3" stroke-dasharray="7 6"/><line x1="300" y1="330" x2="300" y2="482" stroke="#0071b9" stroke-width="3" stroke-dasharray="7 6"/><line x1="300" y1="330" x2="127" y2="406" stroke="#0071b9" stroke-width="3" stroke-dasharray="7 6"/><line x1="300" y1="330" x2="127" y2="254" stroke="#0071b9" stroke-width="3" stroke-dasharray="7 6"/><circle cx="300" cy="178" r="30" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="300" y="232" font-size="18" fill="#70757a" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">zásuvka</text><circle cx="473" cy="254" r="30" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="473" y="210" font-size="18" fill="#70757a" text-anchor="middle">spínač</text><circle cx="473" cy="406" r="30" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="473" y="456" font-size="18" fill="#70757a" text-anchor="middle">senzor</text><circle cx="300" cy="482" r="30" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="300" y="532" font-size="18" fill="#70757a" text-anchor="middle">žiarovka</text><circle cx="127" cy="406" r="30" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="127" y="456" font-size="18" fill="#70757a" text-anchor="middle">kamera</text><circle cx="127" cy="254" r="30" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="127" y="210" font-size="18" fill="#70757a" text-anchor="middle">termostat</text><rect x="228" y="290" width="144" height="80" rx="16" fill="#0071b9"/><text x="300" y="339" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Router</text><text x="300" y="580" font-size="20" fill="#70757a" text-anchor="middle">Každé zariadenie je ďalší klient routera</text><text x="300" y="608" font-size="20" fill="#70757a" text-anchor="middle">a dosah končí tam, kam dosiahne router.</text><line x1="900" y1="246" x2="762" y2="320" stroke="#3aa757" stroke-width="3"/><line x1="900" y1="246" x2="1042" y2="320" stroke="#3aa757" stroke-width="3"/><line x1="762" y1="320" x2="706" y2="438" stroke="#3aa757" stroke-width="3"/><line x1="762" y1="320" x2="900" y2="410" stroke="#3aa757" stroke-width="3"/><line x1="1042" y1="320" x2="900" y2="410" stroke="#3aa757" stroke-width="3"/><line x1="1042" y1="320" x2="1076" y2="438" stroke="#3aa757" stroke-width="3"/><line x1="706" y1="438" x2="820" y2="528" stroke="#3aa757" stroke-width="3"/><line x1="900" y1="410" x2="820" y2="528" stroke="#3aa757" stroke-width="3"/><line x1="900" y1="410" x2="986" y2="528" stroke="#3aa757" stroke-width="3"/><line x1="1076" y1="438" x2="986" y2="528" stroke="#3aa757" stroke-width="3"/><circle cx="762" cy="320" r="28" fill="#fff" stroke="#3aa757" stroke-width="3"/><circle cx="1042" cy="320" r="28" fill="#fff" stroke="#3aa757" stroke-width="3"/><circle cx="706" cy="438" r="28" fill="#fff" stroke="#3aa757" stroke-width="3"/><circle cx="900" cy="410" r="28" fill="#fff" stroke="#3aa757" stroke-width="3"/><circle cx="1076" cy="438" r="28" fill="#fff" stroke="#3aa757" stroke-width="3"/><circle cx="820" cy="528" r="28" fill="#fff" stroke="#3aa757" stroke-width="3"/><circle cx="986" cy="528" r="28" fill="#fff" stroke="#3aa757" stroke-width="3"/><rect x="828" y="178" width="144" height="68" rx="16" fill="#3aa757"/><text x="900" y="221" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Brána</text><text x="900" y="580" font-size="20" fill="#70757a" text-anchor="middle">Napájané zariadenia fungujú ako opakovače,</text><text x="900" y="608" font-size="20" fill="#70757a" text-anchor="middle">takže sieť sa s každým kusom sama spevňuje.</text></svg>
