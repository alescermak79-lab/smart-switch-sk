<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Roboto, Arial, sans-serif" role="img"><title>Päť krokov k inteligentnej domácnosti</title><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="80" font-size="38" font-weight="700" fill="#001233">Inteligentná domácnosť v piatich krokoch</text><text x="60" y="120" font-size="24" fill="#70757a">Kupujte po kúskoch – každý krok funguje aj samostatne.</text><rect x="60" y="200" width="196" height="196" rx="24" fill="#f5f6f8" stroke="#e6e8ec"/><circle cx="158" cy="258" r="34" fill="#0071b9"/><text x="158" y="270" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="158" y="330" font-size="24" font-weight="700" fill="#001233" text-anchor="middle">Zásuvka</text><text x="158" y="362" font-size="19" fill="#70757a" text-anchor="middle">meranie spotreby</text><path d="M264 298 L284 298" stroke="#0071b9" stroke-width="4"/><path d="M278 291 L286 298 L278 305 Z" fill="#0071b9"/><rect x="288" y="200" width="196" height="196" rx="24" fill="#f5f6f8" stroke="#e6e8ec"/><circle cx="386" cy="258" r="34" fill="#0071b9"/><text x="386" y="270" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="386" y="330" font-size="24" font-weight="700" fill="#001233" text-anchor="middle">Spínač</text><text x="386" y="362" font-size="19" fill="#70757a" text-anchor="middle">svetlo z mobilu</text><path d="M492 298 L512 298" stroke="#0071b9" stroke-width="4"/><path d="M506 291 L514 298 L506 305 Z" fill="#0071b9"/><rect x="516" y="200" width="196" height="196" rx="24" fill="#f5f6f8" stroke="#e6e8ec"/><circle cx="614" cy="258" r="34" fill="#0071b9"/><text x="614" y="270" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="614" y="330" font-size="24" font-weight="700" fill="#001233" text-anchor="middle">Senzor</text><text x="614" y="362" font-size="19" fill="#70757a" text-anchor="middle">teplota, dvere</text><path d="M720 298 L740 298" stroke="#0071b9" stroke-width="4"/><path d="M734 291 L742 298 L734 305 Z" fill="#0071b9"/><rect x="744" y="200" width="196" height="196" rx="24" fill="#f5f6f8" stroke="#e6e8ec"/><circle cx="842" cy="258" r="34" fill="#0071b9"/><text x="842" y="270" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="842" y="330" font-size="24" font-weight="700" fill="#001233" text-anchor="middle">Scenáre</text><text x="842" y="362" font-size="19" fill="#70757a" text-anchor="middle">automatizácia</text><path d="M948 298 L968 298" stroke="#0071b9" stroke-width="4"/><path d="M962 291 L970 298 L962 305 Z" fill="#0071b9"/><rect x="972" y="200" width="196" height="196" rx="24" fill="#f5f6f8" stroke="#e6e8ec"/><circle cx="1070" cy="258" r="34" fill="#0071b9"/><text x="1070" y="270" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1070" y="330" font-size="24" font-weight="700" fill="#001233" text-anchor="middle">Brána</text><text x="1070" y="362" font-size="19" fill="#70757a" text-anchor="middle">Zigbee / Matter</text><rect x="60" y="452" width="1080" height="96" rx="20" fill="#fff8ee" stroke="#ffd9a8"/><rect x="88" y="482" width="150" height="40" rx="20" fill="#ff9800"/><text x="163" y="509" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">ODMENA</text><text x="262" y="498" font-size="22" font-weight="700" fill="#001233">7 % zľava na celý nákup</text><text x="262" y="528" font-size="19" fill="#70757a">Kód zadáte v košíku e-shopu smart-switch.cz do políčka pre zľavový kupón.</text></svg>
