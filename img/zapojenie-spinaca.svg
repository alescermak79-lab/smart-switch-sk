<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Roboto, Arial, sans-serif" role="img"><title>Zapojenie inteligentného spínača za vypínačom</title><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="72" font-size="38" font-weight="700" fill="#001233">Čo je v krabici za vypínačom</text><text x="60" y="110" font-size="22" fill="#70757a">Vľavo bežná inštalácia s nulovým vodičom, vpravo riešenie, keď nula v krabici chýba.</text><rect x="60" y="150" width="500" height="410" rx="24" fill="#f5f6f8" stroke="#e6e8ec"/><text x="90" y="192" font-size="24" font-weight="700" fill="#3aa757">Nula v krabici JE</text><rect x="150" y="230" width="320" height="150" rx="14" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="310" y="262" font-size="20" font-weight="700" fill="#001233" text-anchor="middle">inštalačná krabica</text><rect x="196" y="286" width="228" height="64" rx="10" fill="#0071b9"/><text x="310" y="325" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">spínací modul</text><line x1="90" y1="300" x2="196" y2="300" stroke="#001233" stroke-width="5"/><text x="92" y="290" font-size="19" fill="#001233">L</text><line x1="90" y1="336" x2="196" y2="336" stroke="#0071b9" stroke-width="5"/><text x="92" y="328" font-size="19" fill="#0071b9">N</text><line x1="424" y1="318" x2="500" y2="318" stroke="#001233" stroke-width="5"/><circle cx="518" cy="318" r="18" fill="#ff9800"/><text x="310" y="430" font-size="20" fill="#70757a" text-anchor="middle">Modul má trvalé napájanie,</text><text x="310" y="458" font-size="20" fill="#70757a" text-anchor="middle">vypínač zostáva na stene a funguje ďalej.</text><text x="310" y="510" font-size="20" font-weight="700" fill="#3aa757" text-anchor="middle">✔ najlacnejšie riešenie</text><rect x="640" y="150" width="500" height="410" rx="24" fill="#f5f6f8" stroke="#e6e8ec"/><text x="670" y="192" font-size="24" font-weight="700" fill="#c0392b">Nula v krabici NIE JE</text><rect x="676" y="236" width="180" height="110" rx="14" fill="#fff" stroke="#001233" stroke-width="3"/><text x="766" y="282" font-size="20" font-weight="700" fill="#001233" text-anchor="middle">batériový</text><text x="766" y="308" font-size="20" font-weight="700" fill="#001233" text-anchor="middle">vypínač</text><text x="766" y="334" font-size="17" fill="#70757a" text-anchor="middle">RF / Zigbee, bez drôtov</text><path d="M866 291 L946 291" stroke="#0071b9" stroke-width="4" stroke-dasharray="8 6"/><path d="M938 284 L950 291 L938 298 Z" fill="#0071b9"/><rect x="956" y="236" width="160" height="110" rx="14" fill="#0071b9"/><text x="1036" y="282" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">modul</text><text x="1036" y="308" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">pri svietidle</text><text x="890" y="418" font-size="20" fill="#70757a" text-anchor="middle">Modul ide tam, kde nula je –</text><text x="890" y="446" font-size="20" fill="#70757a" text-anchor="middle">do krabice pri svietidle alebo do rozvádzača.</text><text x="890" y="510" font-size="20" font-weight="700" fill="#001233" text-anchor="middle">Vypínač sa nalepí kamkoľvek na stenu.</text><text x="600" y="602" font-size="19" fill="#70757a" text-anchor="middle">Zásah do elektroinštalácie 230 V patrí do rúk osoby s odbornou kvalifikáciou.</text></svg>
