<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Roboto, Arial, sans-serif" role="img"><title>Stavba inteligentnej závlahy</title><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="76" font-size="38" font-weight="700" fill="#001233">Z čoho sa skladá inteligentná závlaha</text><text x="60" y="114" font-size="22" fill="#70757a">Štyri diely – a každý z nich sa dá doplniť neskôr.</text><rect x="60" y="180" width="240" height="170" rx="22" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="180" y="248" font-size="26" font-weight="700" fill="#0071b9" text-anchor="middle">Zdroj vody</text><text x="180" y="288" font-size="19" fill="#70757a" text-anchor="middle">kohútik, sud, čerpadlo</text><path d="M306 265 L336 265" stroke="#70757a" stroke-width="4"/><path d="M328 258 L340 265 L328 272 Z" fill="#70757a"/><rect x="336" y="180" width="240" height="170" rx="22" fill="#fff" stroke="#3aa757" stroke-width="3"/><text x="456" y="248" font-size="26" font-weight="700" fill="#3aa757" text-anchor="middle">Ventil</text><text x="456" y="288" font-size="19" fill="#70757a" text-anchor="middle">WiFi / Zigbee / Bluetooth</text><path d="M582 265 L612 265" stroke="#70757a" stroke-width="4"/><path d="M604 258 L616 265 L604 272 Z" fill="#70757a"/><rect x="612" y="180" width="240" height="170" rx="22" fill="#fff" stroke="#ff9800" stroke-width="3"/><text x="732" y="248" font-size="26" font-weight="700" fill="#ff9800" text-anchor="middle">Napájanie</text><text x="732" y="288" font-size="19" fill="#70757a" text-anchor="middle">batérie alebo solár</text><path d="M858 265 L888 265" stroke="#70757a" stroke-width="4"/><path d="M880 258 L892 265 L880 272 Z" fill="#70757a"/><rect x="888" y="180" width="240" height="170" rx="22" fill="#fff" stroke="#5b6bbf" stroke-width="3"/><text x="1008" y="248" font-size="26" font-weight="700" fill="#5b6bbf" text-anchor="middle">Zóny</text><text x="1008" y="288" font-size="19" fill="#70757a" text-anchor="middle">trávnik, kvapkovka, skleník</text><rect x="60" y="400" width="522" height="160" rx="22" fill="#f5f6f8" stroke="#e6e8ec"/><text x="92" y="444" font-size="24" font-weight="700" fill="#001233">Čo závlahu riadi</text><text x="92" y="482" font-size="20" fill="#70757a">• Časovač priamo vo ventile</text><text x="92" y="510" font-size="20" fill="#70757a">• Senzor pôdnej vlhkosti</text><text x="92" y="538" font-size="20" fill="#70757a">• Scenár v aplikácii podľa počasia</text><rect x="618" y="400" width="522" height="160" rx="22" fill="#fff8ee" stroke="#ffd9a8"/><text x="650" y="444" font-size="24" font-weight="700" fill="#001233">Na čo nezabudnúť</text><text x="650" y="482" font-size="20" fill="#70757a">• Pred zimou vypustiť vodu a ventil demontovať</text><text x="650" y="510" font-size="20" fill="#70757a">• Overiť dosah signálu až na koniec záhrady</text><text x="650" y="538" font-size="20" fill="#70757a">• Solár šetrí batérie, ale potrebuje slnko</text></svg>
