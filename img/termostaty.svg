<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Roboto, Arial, sans-serif" role="img"><title>Prehľad typov inteligentných termostatov</title><rect width="1200" height="630" fill="#ffffff"/><text x="60" y="76" font-size="38" font-weight="700" fill="#001233">Aký termostat k akému zdroju tepla</text><rect x="60" y="150" width="430" height="92" rx="18" fill="#f5f6f8" stroke="#e6e8ec"/><text x="88" y="206" font-size="22" font-weight="700" fill="#001233">Plynový kotol, tepelné čerpadlo</text><path d="M500 196 L578 196" stroke="#0071b9" stroke-width="4"/><path d="M570 189 L582 196 L570 203 Z" fill="#0071b9"/><rect x="596" y="150" width="544" height="92" rx="18" fill="#fff" stroke="#0071b9" stroke-width="3"/><text x="624" y="194" font-size="23" font-weight="700" fill="#0071b9">Spínací termostat</text><text x="624" y="222" font-size="19" fill="#70757a">bezpotenciálový kontakt</text><rect x="60" y="262" width="430" height="92" rx="18" fill="#f5f6f8" stroke="#e6e8ec"/><text x="88" y="318" font-size="22" font-weight="700" fill="#001233">Podlahové kúrenie (elektrické)</text><path d="M500 308 L578 308" stroke="#5b6bbf" stroke-width="4"/><path d="M570 301 L582 308 L570 315 Z" fill="#5b6bbf"/><rect x="596" y="262" width="544" height="92" rx="18" fill="#fff" stroke="#5b6bbf" stroke-width="3"/><text x="624" y="306" font-size="23" font-weight="700" fill="#5b6bbf">Termostat 16 A do steny</text><text x="624" y="334" font-size="19" fill="#70757a">spína priamo výkon</text><rect x="60" y="374" width="430" height="92" rx="18" fill="#f5f6f8" stroke="#e6e8ec"/><text x="88" y="430" font-size="22" font-weight="700" fill="#001233">Radiátor v teplovodnej sústave</text><path d="M500 420 L578 420" stroke="#3aa757" stroke-width="4"/><path d="M570 413 L582 420 L570 427 Z" fill="#3aa757"/><rect x="596" y="374" width="544" height="92" rx="18" fill="#fff" stroke="#3aa757" stroke-width="3"/><text x="624" y="418" font-size="23" font-weight="700" fill="#3aa757">Zigbee termostatická hlavica</text><text x="624" y="446" font-size="19" fill="#70757a">na batérie, na ventil</text><rect x="60" y="486" width="430" height="92" rx="18" fill="#f5f6f8" stroke="#e6e8ec"/><text x="88" y="542" font-size="22" font-weight="700" fill="#001233">Prímotop, infrapanel, ohrievač</text><path d="M500 532 L578 532" stroke="#ff9800" stroke-width="4"/><path d="M570 525 L582 532 L570 539 Z" fill="#ff9800"/><rect x="596" y="486" width="544" height="92" rx="18" fill="#fff" stroke="#ff9800" stroke-width="3"/><text x="624" y="530" font-size="23" font-weight="700" fill="#ff9800">WiFi zásuvka alebo spínač s čidlom</text><text x="624" y="558" font-size="19" fill="#70757a">bez zásahu do rozvodov</text><text x="600" y="612" font-size="19" fill="#70757a" text-anchor="middle">Zapojenie ku kotlu alebo do pevnej inštalácie vždy nechajte odborníkovi.</text></svg>
